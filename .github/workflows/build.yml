name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: bash Scripts/build.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellarStrike.ipa
          path: ShooterGame.ipa
          retention-days: 7
